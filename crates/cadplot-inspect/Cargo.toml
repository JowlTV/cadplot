[package]
name = "cadplot-inspect"
description = "CadPlot: relatório de importação de DWG/DXF pela linha de comando"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "cadplot-inspect"
path = "src/main.rs"

[dependencies]
cadplot-core = { path = "../cadplot-core" }
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Metadados de versão no .exe (nome do produto, empresa, descrição): reduz falso positivo de antivírus.
winresource = "0.1"

[package.metadata.winresource]
ProductName = "CadPlot"
FileDescription = "CadPlot — relatório de importação de DWG/DXF"
CompanyName = "JowlTV"
LegalCopyright = "© 2026 JowlTV"
OriginalFilename = "cadplot-inspect.exe"
