name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths-ignore: ["**.md"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # O app Tauri (cadplot-app) é testado e compilado no job do Windows.
      - run: cargo test --workspace --exclude cadplot-app
      - name: Desempenho (500 mil entidades, release)
        run: cargo test --release -p cadplot-core --test import_fixtures -- --ignored desempenho --nocapture
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Interface (TypeScript + build)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

  windows:
    name: Testes e build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Dependências da interface
        working-directory: apps/desktop
        run: npm ci
      - name: Build da interface (o app embute dist/)
        working-directory: apps/desktop
        run: npm run build
      - name: Testes
        run: cargo test --workspace
      - name: Desempenho (500 mil entidades, release)
        run: cargo test --release -p cadplot-core --test import_fixtures -- --ignored desempenho --nocapture
      - name: Build release do cadplot-inspect
        run: cargo build --release -p cadplot-inspect
      - name: Build release do app CadPlot (Tauri, sem instalador)
        working-directory: apps/desktop
        run: npx tauri build --no-bundle
      - name: Fixtures sintéticos + relatório no Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\fixtures | Out-Null
          cargo run --release -p cadplot-fixtures --example gerar -- out\fixtures
          .\target\release\cadplot-inspect.exe out\fixtures\planta_AC1032.dwg --linhas 15 --json out\fixtures\planta_AC1032.report.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Pacote e SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\cadplot.exe dist\
          Copy-Item target\release\cadplot-inspect.exe dist\
          Copy-Item docs\TESTING.md dist\
          Copy-Item -Recurse out\fixtures dist\fixtures-sinteticos
          $linhas = foreach ($f in @("cadplot.exe", "cadplot-inspect.exe")) {
            $h = (Get-FileHash "dist\$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $linhas | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cadplot-windows-x64
          path: dist/
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cadplot.exe
            dist/cadplot-inspect.exe
            dist/SHA256SUMS.txt
          body: |
            Build do CadPlot para Windows x64. Relatório do milestone em `docs/reports/`, instruções em `docs/TESTING.md`.
            SHA-256 dos binários em `SHA256SUMS.txt`.
